<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Video</title>
<style>
body {
  background:black;
  color:white;
  font-family:sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}
button {
  margin:4px;
  padding:6px 12px;
  cursor: pointer;
}
video {
  width:320px;
  margin-top:10px;
  border:2px solid white;
}
.controls {
  display: flex;
  flex-direction: row;
  margin-top: 10px;
}
.urlBox {
  display: flex;
  flex-direction: row;
  margin-top: 10px;
  gap: 4px;
}
.urlBox input {
  width: 260px;
  padding: 6px;
}
</style>
</head>
<body>

<h3>Vídeos</h3>

<div class="urlBox">
  <input type="text" id="urlInput" placeholder="Cole o link do .mp4 aqui...">
  <button onclick="loadFromUrl()">Carregar</button>
</div>

<div id="list"></div>

<video id="vid" crossorigin="anonymous"></video>

<div class="controls">
  <button onclick="vid.pause()">⏸ Pause</button>
  <button onclick="vid.play()">▶ Play</button>
  <button id="loopBtn" onclick="toggleLoop()">🔁 Loop: Off</button>
</div>

<canvas id="c" width="64" height="64" hidden></canvas>

<script>
const list = document.getElementById("list")
const vid = document.getElementById("vid")
const canvas = document.getElementById("c")
const ctx = canvas.getContext("2d")
const loopBtn = document.getElementById("loopBtn")
const urlInput = document.getElementById("urlInput")

function loadFromUrl() {
  const url = urlInput.value.trim()
  if (!url) return

  vid.src = url
  vid.play()

  fetch("/setAudio",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      audio: url.replace(".mp4",".mp3")
    })
  })
}

// Permite carregar apertando Enter no campo de texto
urlInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") loadFromUrl()
})

function toggleLoop() {
  vid.loop = !vid.loop;

  if (vid.loop) {
    loopBtn.innerText = "🔁 Loop: On";
    loopBtn.style.backgroundColor = "#4CAF50";
    loopBtn.style.color = "white";
  } else {
    loopBtn.innerText = "🔁 Loop: Off";
    loopBtn.style.backgroundColor = "";
    loopBtn.style.color = "";
  }
}

fetch("/videosList")
.then(r=>r.json())
.then(videos=>{
  videos.forEach(v=>{
    const b = document.createElement("button")
    b.innerText = v.name
    b.onclick = ()=>{
      vid.src = v.url
      vid.play()

      fetch("/setAudio",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          audio: v.url.replace(".mp4",".mp3")
        })
      })
    }
    list.appendChild(b)
  })
})

setInterval(()=>{
  if (vid.paused || vid.ended) return
  ctx.drawImage(vid,0,0,64,64)
  fetch("/camera",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      image: canvas.toDataURL("image/jpeg",5).split(",")[1]
    })
  })
},50)
</script>

</body>
</html>
